  generalize: [STREET_ADDRESS]  # TODO: coarsen to city/region
  redact: [PERSON_PRIVATE, EMAIL, PHONE, ID_NUM, DOB, URL_PERSONAL, OTHER_PII, DEMOGRAPHIC]
  edge_cases: ["TODO: LOCATION_OTHER vs home address"]
P3_longitudinal:
