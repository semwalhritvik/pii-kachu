  generalize: [DOB]
  redact: [EMAIL, PHONE, STREET_ADDRESS, URL_PERSONAL, OTHER_PII]
  pseudonymize: [PERSON_PRIVATE, ID_NUM]   # consistent pseudonyms link records
  edge_cases: ["TODO: pseudonym consistency across docs", "TODO: ORG"]
