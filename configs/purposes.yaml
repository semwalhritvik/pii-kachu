# Draft purposes; keep/generalize/redact/pseudonymize over unified labels. Every label appears in exactly one list per purpose.
verdict_table:
  note: per span, class = the purpose's required action for the span label; action = what the case did. Case verdict precedence UNDER > SHOULD_PSEUDONYMIZE > OVER > OK.
  keep:        {keep: OK, generalize: OVER, redact: OVER, pseudonymize: OVER}
  generalize:  {keep: UNDER, generalize: OK, redact: OVER, pseudonymize: OVER}
  redact:      {keep: UNDER, generalize: UNDER, redact: OK, pseudonymize: OK}
  pseudonymize: {keep: UNDER, generalize: UNDER, redact: SHOULD_PSEUDONYMIZE, pseudonymize: OK}
  quasi_groups: a group (list of span ids) is mitigated if any member has action redact or generalize -> group OK and no per-span OVER for its members; UNDER (fault_type=quasi) only if every member is kept.
  detected: spans with detected=false are unchanged text; a redact/pseudonymize/generalize-class span that is undetected is UNDER (fault_type=missed). Judge span table lists detected spans only.
P1_cohort:
  keep: [PERSON_PUBLIC, ORG, DEMOGRAPHIC, DATE_OTHER, LOCATION_OTHER]
  generalize: [DOB]            # TODO: age bands vs year
  redact: [PERSON_PRIVATE, EMAIL, PHONE, ID_NUM, STREET_ADDRESS, URL_PERSONAL, OTHER_PII]
  edge_cases: ["TODO: DEMOGRAPHIC small-cell risk", "TODO: ORG that identifies a person"]
P2_geographic:
